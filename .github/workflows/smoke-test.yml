name: Device smoke test

on:
  workflow_dispatch:
  push:
    paths-ignore: ['fastlane/**', 'docs/**', '**.md']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ImageMagick (screenshots)
        run: sudo apt-get install -y -qq imagemagick >/dev/null

      - name: Build release APK and test APKs
        run: ./gradlew assembleSideloadRelease assembleSideloadDebug assembleSideloadDebugAndroidTest

      - name: Run on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p smoke
            ./gradlew connectedSideloadDebugAndroidTest > smoke/instrumented.txt 2>&1 || touch smoke/instrumented-failed
            grep -E "Tests on|FAILED|AssertionError|ComposeTimeoutException|tests completed" smoke/instrumented.txt | head -20
            find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h -A2 "<failure" {} \; | cut -c1-300 | head -20
            adb logcat -d -s SmokeTest:I | tee smoke/instrumented-results.txt
            bash .github/scripts/smoke.sh
            test ! -f smoke/instrumented-failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            smoke/
            app/build/reports/androidTests/
