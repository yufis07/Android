name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testSideloadDebugUnitTest --stacktrace

      # Optional: sign with your own key so every build installs over the previous one.
      # Add repository secrets SIGNING_KEYSTORE_BASE64 (base64 of a .p12 keystore) and SIGNING_PASSWORD.
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK (sideload) and App Bundle (Google Play)
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_FILE:-}" ]; then
            echo "::warning::No signing secrets set - builds are signed with a temporary debug key. The APK won't install over a previous build and Google Play will reject the .aab."
          fi
          ./gradlew assembleSideloadRelease bundlePlayRelease --stacktrace
          ls -la app/build/outputs/apk/sideload/release/ app/build/outputs/bundle/playRelease/

      - uses: actions/upload-artifact@v4
        with:
          name: GameDealsWatch-apk
          path: app/build/outputs/apk/sideload/release/app-sideload-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameDealsWatch-play-bundle
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/mapping/playRelease/mapping.txt
